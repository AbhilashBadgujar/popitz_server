<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Popitz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
    <link rel="stylesheet" href="https://storage.googleapis.com/popitz/web_client_popitz/styles-css.css">
</head>
<body>
    <div class="sky" aria-hidden="true"></div>
    <div class="scenery" id="scenery" aria-hidden="true"></div>

    <!-- Title screen -->
    <section class="screen screen-title" id="screen-lobby">
        <button type="button" class="round-btn help-btn" id="help-btn" aria-label="How to play">?</button>
        <h1 class="logo" aria-label="Popitz">
            <span>P</span><span>O</span><span>P</span><span>I</span><span>T</span><span>Z</span>
        </h1>
        <div class="mascots" id="mascots"></div>
        <div class="play-zone">
            <button type="button" class="play-btn" id="find-match-btn">PLAY</button>
            <div class="searching" id="searching" role="status" hidden>
                <div class="search-card" aria-hidden="true"></div>
                <span id="searching-text">Finding opponent</span>
                <button type="button" class="round-btn round-btn-sm" id="cancel-match-btn" aria-label="Cancel">
                    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
                </button>
            </div>
            <p class="error-text" id="lobby-error" role="alert"></p>
        </div>
    </section>

    <!-- Draft -->
    <section class="screen screen-draft" id="screen-draft" hidden>
        <div class="draft-top">
            <h1 class="banner-title">CHOOSE 3</h1>
            <div class="pips" id="draft-pips"></div>
        </div>
        <div class="draft-grid" id="card-grid"></div>
        <div class="draft-tray">
            <div class="tray-slots" id="team-slots"></div>
            <button type="button" class="fight-btn" id="lock-in-btn" disabled>FIGHT!</button>
        </div>
    </section>

    <!-- VS splash -->
    <section class="screen screen-vs" id="screen-reveal" hidden>
        <div class="vs-half vs-left"><div class="vs-cards" id="reveal-mine"></div><div class="vs-tag">YOU</div></div>
        <div class="vs-mark">VS</div>
        <div class="vs-half vs-right"><div class="vs-cards" id="reveal-theirs"></div><div class="vs-tag">FOE</div></div>
    </section>

    <!-- Arena -->
    <section class="screen screen-arena" id="screen-battle" hidden>
        <div class="hud hud-top">
            <div class="plate plate-foe">
                <span class="avatar avatar-foe" aria-hidden="true"></span>
                <span class="plate-name">FOE</span>
                <span class="pips pips-sm" id="foe-pips"></span>
            </div>
            <div class="world-medal" id="world-medal"></div>
        </div>

        <div class="board">
            <div class="row row-foe" id="their-row"></div>
            <div class="midline">
                <div class="hint" id="hint" role="status"></div>
            </div>
            <div class="row row-you" id="my-row"></div>
        </div>

        <div class="hud hud-bottom">
            <div class="plate plate-you">
                <span class="avatar avatar-you" aria-hidden="true"></span>
                <span class="plate-name">YOU</span>
                <span class="pips pips-sm" id="you-pips"></span>
            </div>
            <button type="button" class="defend-btn" id="defend-btn" disabled aria-label="Defend selected hero">
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                <span>DEFEND</span>
            </button>
        </div>

        <div class="turn-banner" id="turn-banner" aria-live="polite"></div>
        <div class="fx" id="fx" aria-hidden="true"></div>
    </section>

    <!-- Countdown -->
    <div class="overlay overlay-clear" id="countdown-overlay" hidden>
        <div class="countdown" id="countdown-num">3</div>
    </div>

    <!-- Waiting -->
    <div class="overlay" id="wait-overlay" hidden>
        <div class="search-card search-card-lg" aria-hidden="true"></div>
        <div class="wait-text" role="status">Waiting for opponent</div>
    </div>

    <!-- Result -->
    <div class="overlay" id="result-overlay" role="dialog" aria-labelledby="result-title" hidden>
        <div class="rays" aria-hidden="true"></div>
        <div class="confetti" id="confetti" aria-hidden="true"></div>
        <div class="result-box" id="result-card">
            <h2 class="result-ribbon" id="result-title">VICTORY</h2>
            <div class="result-stars" id="result-stars" aria-hidden="true"></div>
            <p class="result-text" id="result-text"></p>
            <button type="button" class="play-btn play-btn-md" id="play-again-btn">PLAY AGAIN</button>
        </div>
    </div>

    <!-- How to play -->
    <div class="overlay" id="help-overlay" role="dialog" aria-labelledby="help-title" hidden>
        <div class="help-box">
            <button type="button" class="round-btn round-btn-sm help-close" id="help-close" aria-label="Close">
                <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
            </button>
            <h2 class="banner-title banner-title-sm" id="help-title">HOW TO PLAY</h2>
            <div class="help-grid" id="help-grid"></div>
        </div>
    </div>

    <script src="https://unpkg.com/colyseus.js@^0.15.0/dist/colyseus.js"></script>
    <script src="https://storage.googleapis.com/popitz/web_client_popitz/complete-script-js.js"></script>
</body>
</html>
